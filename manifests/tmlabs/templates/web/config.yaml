---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "web-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "web"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  NODE_ENV: {{ tpl "{{ .Values.config.web.NODE_ENV }}" . | quote }}
  PORT: {{ tpl "{{ .Values.config.web.PORT }}" . | quote }}
  HOSTNAME: {{ tpl "{{ .Values.config.web.HOSTNAME }}" . | quote }}
  GATEWAY_HTTP: {{ tpl "http://gateway-service:{{ .Values.parameters.gateway.port_http }}" . | quote }}
  services__gateway__http__0: {{ tpl "http://gateway-service:{{ .Values.parameters.gateway.port_http }}" . | quote }}
  GATEWAY_HTTPS: {{ tpl "https://gateway-service:{{ .Values.parameters.gateway.port_http }}" . | quote }}
  AUTH_URL: {{ tpl "{{ .Values.config.web.app_url }}" . | quote }}
  AUTH_TRUST_HOST: {{ tpl "{{ .Values.config.web.AUTH_TRUST_HOST }}" . | quote }}
  API_URL: {{ tpl "http://gateway-service:{{ .Values.parameters.gateway.port_http }}" . | quote }}
  NEXT_PUBLIC_API_BASE_URL: {{ tpl "http://gateway-service:{{ .Values.parameters.gateway.port_http }}" . | quote }}
  KEYCLOAK_URL: {{ tpl "{{ .Values.config.web.keycloak_url }}" . | quote }}
  KEYCLOAK_REALM: {{ tpl "{{ .Values.config.web.keycloak_realm }}" . | quote }}
  KEYCLOAK_CLIENT_ID: {{ tpl "{{ .Values.config.web.keycloak_client_id }}" . | quote }}
  NEXT_PUBLIC_KEYCLOAK_URL: {{ tpl "{{ .Values.config.web.keycloak_url }}" . | quote }}
  NEXT_PUBLIC_KEYCLOAK_REALM: {{ tpl "{{ .Values.config.web.keycloak_realm }}" . | quote }}
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: {{ tpl "{{ .Values.config.web.keycloak_client_id }}" . | quote }}
  NEXT_PUBLIC_KEYCLOAK_REDIRECT_URI: {{ tpl "{{ .Values.config.web.app_url }}/api/auth/callback/keycloak" . | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl "{{ .Values.config.web.OTEL_EXPORTER_OTLP_ENDPOINT }}" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ tpl "{{ .Values.config.web.OTEL_EXPORTER_OTLP_PROTOCOL }}" . | quote }}
  OTEL_SERVICE_NAME: {{ tpl "{{ .Values.config.web.OTEL_SERVICE_NAME }}" . | quote }}
