# Public entry points.
#
# No ingressClassName is set, so the cluster's default IngressClass handles it.
# Add one if your cluster has no default:
#   spec.ingressClassName: traefik      # k3s default
#   spec.ingressClassName: nginx        # ingress-nginx
#
# Two paths, longest-prefix wins:
#
#   /api/blog  → gateway-service  so the public blog repo workflow can call
#                                 POST /api/blog/sync. The endpoint requires an
#                                 `admin` token AND a syncToken, so exposing the
#                                 path is not the same as exposing the operation.
#   /          → web-service      everything else.
#
# The rest of the gateway (/api/chat) stays cluster-internal, and the frontend
# reaches it server-side via API_URL=http://gateway-service:8080.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tmlabs-web
  namespace: tmlabs
spec:
  rules:
    - host: blog-test.tiyiselani.com
      http:
        paths:
          - path: /api/blog
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
  # Uncomment once a TLS issuer is configured. The secret is created by
  # cert-manager (or by whatever terminates TLS in front of the cluster).
  # tls:
  #   - hosts:
  #       - blog-test.tiyiselani.com
  #     secretName: tmlabs-web-tls
