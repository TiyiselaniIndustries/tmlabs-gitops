# Public entry point for the Next.js frontend.
#
# The gateway stays ClusterIP on purpose: the frontend calls it server-side
# (API_URL=http://gateway-service:8080), so the browser never needs it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tmlabs-web
  namespace: tmlabs
  annotations:
    # Fill in for your cluster's ingress controller, and delete this TODO.
    # k3s/traefik:   kubernetes.io/ingress.class: traefik
    # nginx:         kubernetes.io/ingress.class: nginx
    # cert-manager:  cert-manager.io/cluster-issuer: <issuer-name>
    TODO-set-ingress-class: "true"
spec:
  rules:
    - host: blog-test.tiyiselani.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
  # Uncomment once a TLS issuer is configured. The secret is created by
  # cert-manager (or by whatever terminates TLS in front of the cluster).
  # tls:
  #   - hosts:
  #       - blog-test.tiyiselani.com
  #     secretName: tmlabs-web-tls
