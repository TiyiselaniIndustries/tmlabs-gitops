# Secrets for the TmLabs workloads.
#
# The deploy workflow strips the chart's own Secret templates before publishing,
# so these ExternalSecrets are the only writers of these Secret names. The names
# and keys must match what the Deployments read, or pods start without config.
#
# OpenBao layout this expects (KV v2, mount `secret`):
#
#   secret/tmlabs/web          auth_secret, revalidate_secret
#   secret/tmlabs/blogapi      connection_string, github_sync_token
#   secret/tmlabs/chatservice  connection_string
#
# Change `secretStoreRef.name` (and the `key` prefixes, if your mount is not
# called `secret`) to match your cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
  namespace: tmlabs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: web-secrets
    creationPolicy: Owner
  data:
    # Signing key for the Auth.js session cookie. Rotating it signs everyone out.
    - secretKey: AUTH_SECRET
      remoteRef:
        key: tmlabs/web
        property: auth_secret
    # Shared secret for POST /api/revalidate. The endpoint returns 401 while unset.
    - secretKey: REVALIDATE_SECRET
      remoteRef:
        key: tmlabs/web
        property: revalidate_secret
    # Same value as blogapi's github_sync_token: the site's "Sync now" action
    # forwards the user's token and injects this server-side, so the browser
    # never sees it.
    - secretKey: BLOG_SYNC_TOKEN
      remoteRef:
        key: tmlabs/blogapi
        property: github_sync_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blogapi-secrets
  namespace: tmlabs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: blogapi-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__tmlabs_db
      remoteRef:
        key: tmlabs/blogapi
        property: connection_string
    # Required: BlogApi throws at startup when GitHub:SyncToken is empty, so the
    # pod crash-loops without this key. It also authenticates POST /api/blog/sync.
    - secretKey: GitHub__SyncToken
      remoteRef:
        key: tmlabs/blogapi
        property: github_sync_token
    # Optional: raises the GitHub API rate limit and allows syncing a private
    # repo. Uncomment once `github_token` exists in OpenBao.
    # - secretKey: GitHub__Token
    #   remoteRef:
    #     key: tmlabs/blogapi
    #     property: github_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatservice-secrets
  namespace: tmlabs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: chatservice-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__tmlabs_db
      remoteRef:
        key: tmlabs/chatservice
        property: connection_string
