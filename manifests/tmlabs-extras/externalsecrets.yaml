# Secrets for the TmLabs workloads.
#
# The workflow strips the chart's own Secret templates (chart/templates/*/secrets.yaml)
# before publishing, so these ExternalSecrets are the only writers of these Secret
# names. The names and keys must match what the Deployments consume:
#
#   web-secrets          AUTH_SECRET, REVALIDATE_SECRET
#   blogapi-secrets      ConnectionStrings__tmlabs_db
#   chatservice-secrets  ConnectionStrings__tmlabs_db
#
# TODO: replace `openbao` with your ClusterSecretStore name and the remote keys
# with the paths/properties used in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
  namespace: tmlabs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: web-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: tmlabs/web
        property: auth_secret
    - secretKey: REVALIDATE_SECRET
      remoteRef:
        key: tmlabs/web
        property: revalidate_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blogapi-secrets
  namespace: tmlabs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: blogapi-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__tmlabs_db
      remoteRef:
        key: tmlabs/database
        property: blogapi_connection_string
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatservice-secrets
  namespace: tmlabs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: chatservice-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__tmlabs_db
      remoteRef:
        key: tmlabs/database
        property: chatservice_connection_string
