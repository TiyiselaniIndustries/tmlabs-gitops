# Argo CD Application for the generated Aspire Helm chart.
#
# CI rewrites manifests/tmlabs on every deploy (image tags, and the chart itself
# is regenerated by `aspire publish`), so do not edit files under that path by
# hand — change the AppHost or the workflow instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tmlabs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TiyiselaniIndustries/tmlabs-gitops.git
    targetRevision: main
    path: manifests/tmlabs
  destination:
    server: https://kubernetes.default.svc
    namespace: tmlabs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
